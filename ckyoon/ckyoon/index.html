<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a1a1a">
<title>윤철국 팀장 | 인타이어 모터스 대구 전시장</title>
<meta property="og:title" content="윤철국 팀장 | 인타이어 모터스 대구 전시장">
<meta property="og:description" content="Range Rover · Defender · Discovery | 010-6236-7744 | ckyoon@entire.co.kr">
<meta property="og:type" content="profile">

<!-- ============================================================
  폰트 안내
  - 원본 명함은 JLREmeric(랜드로버 본사 라이선스 폰트)을 씁니다.
  - 그 폰트 파일을 못 구해서, 느낌이 비슷한 무료 폰트로 대체했습니다.
    · 한글: Pretendard (국내 프리미엄 브랜드에서 널리 쓰는 깔끔한 서체)
    · 영문 로고 타입: Space Grotesk (각지고 트래킹 넓은 느낌이 비슷함)
  - 나중에 진짜 JLREmeric 폰트 파일(.woff2)이 생기면
    아래 @font-face 부분만 교체하면 100% 동일해집니다.
============================================================= -->
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">

<style>
  /* =============================================================
     디자인 토큰 (CI에서 뽑아낸 값들)
     이 값들만 바꾸면 전체 톤이 바뀝니다.
  ============================================================= */
  :root{
    --ink:        #1a1a1a;   /* 원본 명함 텍스트 색 (거의 검정) */
    --ink-soft:   #7a7a7a;   /* 보조 텍스트(라벨 등) */
    --paper:      #ffffff;   /* 배경 */
    --paper-soft: #f6f6f5;   /* 섹션 구분용 옅은 배경 */
    --line:       #e3e3e1;   /* 얇은 구분선 */
    --radius:     2px;       /* 랜드로버 CI는 각진 느낌 → 라운드 최소화 */
    --gap:        20px;
    --max-w:      430px;     /* 모바일 명함 폭 기준 */
  }

  * { box-sizing:border-box; margin:0; padding:0; }
  html,body{ background:var(--paper); }
  body{
    font-family:'Pretendard', -apple-system, sans-serif;
    color:var(--ink);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:var(--max-w);
    margin:0 auto;
    padding:0 24px 48px;
  }

  /* ---------- 상단 명함 블럭 (PDF 캡처 이미지) ---------- */
  .card-image{
    padding:28px 0 32px;
  }
  .card-image img{
    width:100%;
    height:auto;
    display:block;
  }

  /* ---------- 액션 버튼 그리드 ---------- */
  .actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:26px;
  }
  .actions a, .actions button{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    padding:16px 8px;
    background:var(--paper-soft);
    border:1px solid var(--line);
    border-radius:var(--radius);
    color:var(--ink);
    text-decoration:none;
    font-family:inherit;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .actions .primary{
    grid-column:1 / -1;
    background:var(--ink);
    color:var(--paper);
    border-color:var(--ink);
    flex-direction:row;
    padding:15px;
    font-size:14px;
    letter-spacing:0.02em;
  }
  .actions .icon{ font-size:18px; }

  /* ---------- 섹션 공통 ---------- */
  .section{ margin-top:36px; }
  .section h2{
    font-size:11px;
    font-weight:700;
    letter-spacing:0.18em;
    color:var(--ink-soft);
    margin-bottom:12px;
  }

  /* ---------- 위치 ---------- */
  .address-card{
    background:var(--paper-soft);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px;
  }
  .address-card p{ font-size:14.5px; margin-bottom:12px; }
  .map-row{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  .map-row a{
    display:flex; align-items:center; justify-content:center;
    padding:10px 4px;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius);
    font-size:12.5px; font-weight:600; color:var(--ink);
    text-decoration:none;
  }
  .copy-btn{
    width:100%; margin-top:8px;
    padding:10px; font-size:12.5px; font-weight:600;
    background:transparent; border:1px solid var(--line);
    border-radius:var(--radius); color:var(--ink-soft);
  }

  footer{
    margin-top:44px;
    padding-top:20px;
    border-top:1px solid var(--line);
    text-align:center;
    font-size:11.5px;
    color:var(--ink-soft);
    letter-spacing:0.05em;
  }

  .toast{
    position:fixed; left:50%; bottom:28px; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:var(--paper);
    padding:11px 18px; border-radius:20px; font-size:13px;
    opacity:0; transition:all .25s ease; pointer-events:none;
    white-space:nowrap;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<!-- =============================================================
  ▼▼▼ 사람별로 바뀌는 정보는 전부 여기 한 곳에 있습니다 ▼▼▼
  다음 사람 명함 만들 때는 이 객체만 새 값으로 바꾸면 됩니다.
============================================================= -->
<script>
const PERSON = {
  nameKr: "윤철국",
  nameEn: "Yoon, Chulkuk",
  titleKr: "영업사원",
  titleEn: "Sales Executive",
  rank: "팀장",
  branchKr: "대구 전시장",
  companyKr: "인타이어 모터스",
  address: "경상북도 대구 서구 와룡로 314 (41845)",
  addressShort: "대구 서구 와룡로 314",
  phoneMain: "053-742-2500",
  phoneMobile: "010-6236-7744",
  email: "ckyoon@entire.co.kr",
  // "3" = RANGE ROVER·DEFENDER·DISCOVERY / "4" = 여기에 JAGUAR까지 취급하는 경우
  brandSet: "3"
};
</script>

<div class="wrap">

  <!-- 상단 명함 블럭: PDF 원본을 그대로 캡처한 이미지 -->
  <div class="card-image">
    <img src="assets/card-block.png" alt="윤철국 팀장 명함 - Range Rover, Defender, Discovery, 인타이어 모터스 대구 전시장">
  </div>

  <!-- 액션 버튼 -->
  <div class="actions">
    <a href="#" class="primary" id="btnCall">
      <span class="icon">📞</span><span id="btnCallLabel"></span>
    </a>
    <a href="ckyoon.vcf" id="btnSave"><span class="icon">💾</span>연락처 저장</a>
    <a href="#" id="btnSms"><span class="icon">💬</span>문자 보내기</a>
    <a href="#" id="btnEmail"><span class="icon">✉️</span>이메일</a>
    <button id="btnShare"><span class="icon">🔗</span>명함 공유</button>
  </div>

  <!-- 위치 -->
  <div class="section">
    <h2>LOCATION</h2>
    <div class="address-card">
      <p id="addrFull"></p>
      <div class="map-row">
        <a id="mapTmap" target="_blank" rel="noopener">T 티맵</a>
        <a id="mapKakao" target="_blank" rel="noopener">K 카카오맵</a>
        <a id="mapNaver" target="_blank" rel="noopener">N 네이버맵</a>
      </div>
      <button class="copy-btn" id="btnCopyAddr">주소 복사</button>
    </div>
  </div>

  <footer id="footerCompany"></footer>
</div>

<div class="toast" id="toast"></div>

<script>
// ============================================================
// 아래부터는 공통 로직입니다. 사람이 바뀌어도 건드릴 필요 없어요.
// 상단 명함 블럭은 이제 이미지 한 장(assets/card-block.png)이라
// 화면에 이름/연락처를 직접 그려주는 코드는 필요 없어졌어요.
// 다만 버튼(전화/문자/이메일/지도/공유)은 PERSON 값을 그대로 씁니다.
// ============================================================

document.getElementById('addrFull').textContent = PERSON.address;
document.getElementById('footerCompany').textContent =
  `${PERSON.companyKr.toUpperCase()}${PERSON.branchKr ? ' · ' + PERSON.branchKr.toUpperCase() : ''}`;

// 3) 전화 / 문자 / 이메일 버튼
document.getElementById('btnCall').href = `tel:${PERSON.phoneMobile}`;
document.getElementById('btnCallLabel').textContent = `${PERSON.phoneMobile} 바로 통화`;
document.getElementById('btnSms').href = `sms:${PERSON.phoneMobile}`;
document.getElementById('btnEmail').href = `mailto:${PERSON.email}`;

// 4) 연락처 저장은 이제 ckyoon.vcf 실제 파일을 링크로 바로 여는 방식입니다.
// (자바스크립트로 즉석 생성하던 이전 방식은 아이폰 사파리에서 자주 깨져서 제거했습니다)

// 5) 명함 공유 (Web Share API, 안되면 링크 복사)
document.getElementById('btnShare').addEventListener('click', async () => {
  const shareData = {
    title: `${PERSON.nameKr} | ${PERSON.companyKr}`,
    text: `${PERSON.nameKr} ${PERSON.rank} | ${PERSON.companyKr} ${PERSON.branchKr}`,
    url: location.href
  };
  if (navigator.share) {
    try { await navigator.share(shareData); } catch (e) {}
  } else {
    await navigator.clipboard.writeText(location.href);
    showToast('링크가 복사되었습니다');
  }
});

// 6) 지도 링크
const q = encodeURIComponent(PERSON.address);
document.getElementById('mapTmap').href = `tmap://search?name=${q}`;
document.getElementById('mapKakao').href = `https://m.map.kakao.com/scheme/search?q=${q}`;
document.getElementById('mapNaver').href = `https://map.naver.com/p/search/${q}`;

// 7) 주소 복사
document.getElementById('btnCopyAddr').addEventListener('click', async () => {
  await navigator.clipboard.writeText(PERSON.address);
  showToast('주소가 복사되었습니다');
});

// 토스트 알림
let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}
</script>
</body>
</html>
