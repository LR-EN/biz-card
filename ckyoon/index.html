<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a1a1a">
<title>윤철국 팀장 | 인타이어 모터스 대구 전시장</title>
<meta property="og:title" content="윤철국 팀장 | 인타이어 모터스 대구 전시장">
<meta property="og:description" content="Range Rover · Defender · Discovery | 010-6236-7744 | ckyoon@entire.co.kr">
<meta property="og:type" content="profile">

<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:        #1a1a1a;
    --ink-soft:   #7a7a7a;
    --paper:      #ffffff;
    --paper-soft: #f6f6f5;
    --line:       #e3e3e1;
    --radius:     2px;
    --gap:        20px;
    --max-w:      430px;
  }

  * { box-sizing:border-box; margin:0; padding:0; }
  html,body{ background:var(--paper); }
  body{
    font-family:'Pretendard', -apple-system, sans-serif;
    color:var(--ink);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:var(--max-w);
    margin:0 auto;
    padding:0 24px 48px;
  }

  /* ── 상단 명함 카드 블럭 ── */
  .card-block {
    margin: 24px 0 0;
    background: #f0eeeb;
    border-radius: 4px;
    padding: 24px 22px 22px;
    position: relative;
    overflow: hidden;
  }

  /* 브랜드 로고타입 (우측 상단) */
  .brand-logo {
    position: absolute;
    top: 20px;
    right: 22px;
    text-align: right;
    font-family: 'Space Grotesk', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 0;
  }
  .brand-logo .brand-name {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.22em;
    color: var(--ink);
    line-height: 1.2;
  }
  .brand-logo .brand-divider {
    width: 26px;
    height: 1px;
    background: var(--ink);
    margin: 4px 0;
    opacity: 0.5;
  }

  /* 인물 정보 텍스트 */
  .card-info {
    margin-top: 60px; /* 로고 아래 여백 */
  }
  .card-info .name-row {
    font-family: 'Pretendard', sans-serif;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--ink);
    line-height: 1.3;
    margin-bottom: 10px;
  }
  .card-info .name-row .name-en {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 13px;
    font-weight: 400;
    color: var(--ink-soft);
    letter-spacing: 0.04em;
    margin-left: 6px;
  }
  .card-info .detail-row {
    font-size: 13px;
    color: #4a4a4a;
    line-height: 1.75;
    letter-spacing: -0.01em;
  }
  .card-info .detail-row .label {
    color: var(--ink-soft);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.06em;
  }
  .card-info .divider-text {
    color: var(--line);
    margin: 0 5px;
  }

  /* ── 액션 버튼 그리드 ── */
  .actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:16px;
  }
  .actions a, .actions button{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    padding:16px 8px;
    background:var(--paper-soft);
    border:1px solid var(--line);
    border-radius:var(--radius);
    color:var(--ink);
    text-decoration:none;
    font-family:inherit;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .actions .primary{
    grid-column:1 / -1;
    background:var(--ink);
    color:var(--paper);
    border-color:var(--ink);
    flex-direction:row;
    padding:15px;
    font-size:14px;
    letter-spacing:0.02em;
  }
  .actions .icon{ font-size:18px; }

  /* ── 섹션 공통 ── */
  .section{ margin-top:36px; }
  .section h2{
    font-size:11px;
    font-weight:700;
    letter-spacing:0.18em;
    color:var(--ink-soft);
    margin-bottom:12px;
  }

  /* ── 위치 ── */
  .address-card{
    background:var(--paper-soft);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px;
  }
  .address-card p{ font-size:14.5px; margin-bottom:12px; }
  .map-row{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  .map-row a{
    display:flex; align-items:center; justify-content:center;
    padding:10px 4px;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius);
    font-size:12.5px; font-weight:600; color:var(--ink);
    text-decoration:none;
  }
  .copy-btn{
    width:100%; margin-top:8px;
    padding:10px; font-size:12.5px; font-weight:600;
    background:transparent; border:1px solid var(--line);
    border-radius:var(--radius); color:var(--ink-soft);
    cursor:pointer; font-family:inherit;
  }

  footer{
    margin-top:44px;
    padding-top:20px;
    border-top:1px solid var(--line);
    text-align:center;
    font-size:11.5px;
    color:var(--ink-soft);
    letter-spacing:0.05em;
  }

  .toast{
    position:fixed; left:50%; bottom:28px; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:var(--paper);
    padding:11px 18px; border-radius:20px; font-size:13px;
    opacity:0; transition:all .25s ease; pointer-events:none;
    white-space:nowrap;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<script>
const PERSON = {
  nameKr: "윤철국",
  nameEn: "Yoon, Chulkuk",
  titleKr: "영업사원",
  titleEn: "Sales Executive",
  rank: "팀장",
  branchKr: "대구 전시장",
  companyKr: "인타이어 모터스",
  address: "경상북도 대구 서구 와룡로 314 (41845)",
  addressShort: "대구 서구 와룡로 314",
  phoneMain: "053-742-2500",
  phoneMobile: "010-6236-7744",
  email: "ckyoon@entire.co.kr",
  brandSet: "3"
};
</script>

<div class="wrap">

  <!-- 상단 명함 카드 블럭 -->
  <div class="card-block">

    <!-- 브랜드 로고타입 (CSS 재현) -->
    <div class="brand-logo">
      <span class="brand-name">RANGE ROVER</span>
      <div class="brand-divider"></div>
      <span class="brand-name">DEFENDER</span>
      <div class="brand-divider"></div>
      <span class="brand-name">DISCOVERY</span>
    </div>

    <!-- 인물 정보 -->
    <div class="card-info">
      <div class="name-row">
        윤철국 <span class="name-en">Yoon, Chulkuk</span>
      </div>
      <div class="detail-row">
        <span id="titleLine"></span><br>
        <span id="branchLine"></span><br>
        <span id="addressLine"></span><br>
        <span id="phoneLine"></span><br>
        <span id="emailLine"></span>
      </div>
    </div>
  </div>

  <!-- 액션 버튼 -->
  <div class="actions">
    <a href="#" class="primary" id="btnCall">
      <span class="icon">📞</span><span id="btnCallLabel"></span>
    </a>
    <a href="ckyoon.vcf" id="btnSave"><span class="icon">💾</span>연락처 저장</a>
    <a href="#" id="btnSms"><span class="icon">💬</span>문자 복내기</a>
    <a href="#" id="btnEmail"><span class="icon">✉️</span>이메일</a>
    <button id="btnShare"><span class="icon">🔗</span>명함 공유</button>
  </div>

  <!-- 위치 -->
  <div class="section">
    <h2>LOCATION</h2>
    <div class="address-card">
      <p id="addrFull"></p>
      <div class="map-row">
        <a id="mapTmap" target="_blank" rel="noopener">T 티맵</a>
        <a id="mapKakao" target="_blank" rel="noopener">K 카카오맵</a>
        <a id="mapNaver" target="_blank" rel="noopener">N 네이버맵</a>
      </div>
      <button class="copy-btn" id="btnCopyAddr">주소 복사</button>
    </div>
  </div>

  <footer id="footerCompany"></footer>
</div>

<div class="toast" id="toast"></div>

<script>
// 인물 정보 텍스트 렌더링
document.getElementById('titleLine').textContent =
  `${PERSON.titleKr} | ${PERSON.titleEn} (${PERSON.rank})`;
document.getElementById('branchLine').textContent =
  `${PERSON.branchKr} | ${PERSON.companyKr}`;
document.getElementById('addressLine').textContent = PERSON.address;
document.getElementById('phoneLine').textContent =
  `${PERSON.phoneMain}  |  ${PERSON.phoneMobile}`;
document.getElementById('emailLine').textContent = PERSON.email;

document.getElementById('addrFull').textContent = PERSON.address;
document.getElementById('footerCompany').textContent =
  `${PERSON.companyKr.toUpperCase()} · ${PERSON.branchKr.toUpperCase()}`;

// 전화 / 문자 / 이메일 버튼
document.getElementById('btnCall').href = `tel:${PERSON.phoneMobile}`;
document.getElementById('btnCallLabel').textContent = `${PERSON.phoneMobile} 바로 통화`;
document.getElementById('btnSms').href = `sms:${PERSON.phoneMobile}`;
document.getElementById('btnEmail').href = `mailto:${PERSON.email}`;

// 명함 공유
document.getElementById('btnShare').addEventListener('click', async () => {
  const shareData = {
    title: `${PERSON.nameKr} | ${PERSON.companyKr}`,
    text: `${PERSON.nameKr} ${PERSON.rank} | ${PERSON.companyKr} ${PERSON.branchKr}`,
    url: location.href
  };
  if (navigator.share) {
    try { await navigator.share(shareData); } catch (e) {}
  } else {
    await navigator.clipboard.writeText(location.href);
    showToast('링크가 복사되었습니다');
  }
});

// 지도 링크
const q = encodeURIComponent(PERSON.address);
document.getElementById('mapTmap').href = `tmap://search?name=${q}`;
document.getElementById('mapKakao').href = `https://m.map.kakao.com/scheme/search?q=${q}`;
document.getElementById('mapNaver').href = `https://map.naver.com/p/search/${q}`;

// 주소 복사
document.getElementById('btnCopyAddr').addEventListener('click', async () => {
  await navigator.clipboard.writeText(PERSON.address);
  showToast('주소가 복사되었습니다');
});

// 토스트 알림
let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}
</script>
</body>
</html>
